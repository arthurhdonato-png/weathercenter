# Temporário: testa o acesso às fontes estaduais a partir do GitHub Actions
name: Sondar fontes estaduais
on:
  push:
    branches: ['claude/project-thread-t2b639']
    paths: ['ferramentas/sondar_*', '.github/workflows/sondar-fontes.yml']
permissions:
  contents: write
jobs:
  rs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 ferramentas/sondar_rs.py
      - run: |
          cd sonda && git init -q -b sonda-rs && git add . && git -c user.name=bot -c user.email=bot@x commit -qm sonda
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sonda-rs
